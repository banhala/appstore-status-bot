name: Keepalive

on:
  schedule:
    - cron: '0 0 1 * *' # 매월 1일, public 저장소 60일 비활성 시 스케줄 정지 방지
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # README 커밋 푸시
    steps:
      - uses: actions/checkout@v7

      - name: README 날짜 갱신
        run: |
          sed -i "s/^> update date: .*/> update date: $(date -u +%F)/" README.md

      - name: 커밋 푸시
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Auto update date' || exit 0
          git push
