name: Poll App Store Status

on:
  repository_dispatch:
    types: [appstore-review-window] # ably-react-native 릴리즈 워크플로우의 enforce_phased_release 직후 발사
  schedule:
    - cron: '*/5 * * * *' # 명목 5분 (GitHub 스로틀로 실제 ~30-50분)
  workflow_dispatch: # 수동 윈도우 오픈/폴링

concurrency:
  group: appstore-poll
  cancel-in-progress: false # dispatch/cron 겹침 시 직렬화

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 상태는 gist에 저장하므로 레포 쓰기 불필요
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: 상태 폴링
        run: npm start
        env:
          # 트리거 입력 (event 데이터는 env로만 전달 — 인젝션 방지)
          TRIGGER: ${{ github.event_name }}
          WINDOW_VERSION: ${{ github.event.client_payload.version }}
          RELEASE_NOTE: ${{ github.event.client_payload.releaseNote }}
          # ASC / Slack 시크릿
          KEY_ID: ${{ secrets.KEY_ID }}
          ISSUER_ID: ${{ secrets.ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          SLACK_WEB_CLIENT_API_KEY: ${{ secrets.SLACK_WEB_CLIENT_API_KEY }}
          CHANNEL_R: ${{ secrets.CHANNEL_R }}
          # 멘션 subteam: 고정 2개 + GROUP_ID_P
          MENTION_GROUP_IDS: S01DBJMNK4P,S09PR1FJTJP,${{ secrets.GROUP_ID_P }}
          # 상태 저장 gist
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DRY_RUN: 'false' # 라이브 발송 (필요 시 true로 무발송 전환)

      - name: 실패 알림
        if: failure()
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_WEB_CLIENT_API_KEY }}
          SLACK_CHANNEL: ${{ secrets.CHANNEL_CI }} # 실패 알림은 CI 채널(#ch_ios_ci)로 분리
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n --arg ch "$SLACK_CHANNEL" \
            --arg text "⚠️ appstore-status-bot 실행 실패: $RUN_URL" \
            '{channel: $ch, text: $text}')
          # Slack은 not_in_channel 등 실패에도 HTTP 200이라 curl -f로 못 잡음
          resp=$(curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload" || true)
          if [ "$(printf '%s' "$resp" | jq -r '.ok // empty' 2>/dev/null)" != "true" ]; then
            echo "::warning::Slack 실패 알림 전송 실패: $resp"
          fi
